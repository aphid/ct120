<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audio features</title>
</head>
<script type="text/javascript" src="https://unpkg.com/meyda@5.6.3/dist/web/meyda.min.js"></script>

<body>
    <audio id="the_aud" muted controls></audio>
    <pre id="output"></pre>
</body>

<script>

    async function getAudio() {
        if (navigator.mediaDevices) {
            const audioContext = new AudioContext();
            console.log("getUserMedia supported.");
            let stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            the_aud.srcObject = stream;
            const source = audioContext.createMediaElementSource(the_aud);
            //source.connect(audioContext.destination);

            if (typeof Meyda === "undefined") {
                console.log("Meyda could not be found! Have you included it?");
            } else {
                const analyzer = Meyda.createMeydaAnalyzer({
                    audioContext: audioContext,
                    source: source,
                    bufferSize: 512,
                    featureExtractors: ["chroma"],
                    callback: (features) => {
                        output.textContent = JSON.stringify(features, undefined, 2);
                    },
                });
                analyzer.start();
            }


        }
    }





    getAudio();

</script>

</html>
