<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p l a y ( o r _ p a u s e )</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;


        }

        .flowy {
            background: radial-gradient(circle, rgba(63, 94, 251, 1) 0%, rgba(252, 70, 107, 1) 100%);
            animation-name: rotateTheHue;
            animation-duration: 23s;
            animation-iteration-count: infinite;

        }

        video {
            width: 100%;
            height: 100%;
            max-width: 84vw;
            max-height: 84vh;
        }

        #container {
            position: absolute;
            display: grid;
            max-width: 84vw;
            max-height: 84vh;
            z-index: 50;
        }

        #progress {
            position: absolute;
            bottom: 0;
            height: 4vh;
            left: 0;
            background: papayawhip;
            width: 100vw;
            cursor: crosshair;
            background: radial-gradient(circle, rgba(63, 94, 251, 1) 0%, rgba(252, 70, 107, 1) 100%);
        }

        #progbar {
            position: relative;
            background: palevioletred;
            height: 100%;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: hue-rotate(180deg);
            width: 0%;
        }

        @keyframes rotateTheHue {
            from {
                backdrop-filter: hue-rotate(0deg);
            }

            to {
                backdrop-filter: hue-rotate(360deg);
            }
        }

        button {
            position: absolute;
            left: -500px;
            top: -100px;
            background: transparent;
            border: 0;
            font-size: 4em;
            z-index: 1000;
            transition: top 8s ease-in,
                filter 3s ease-in-out;
            cursor: pointer;
            filter: blur(0px);
            text-shadow: 3px 3px 10px black;

        }

        .rosie {
            pointer-events: none;
        }

        #vidtitle {
            position: absolute;
            bottom: 15px;
            left: 15px;
            font-family: monospace;
            color: white;
            text-shadow: 2px 2px 2px black;
            opacity: 0;
        }

        .blursedButton {
            backdrop-filter: blur(10px);
            filter: blur(10px);
            width: 80px;
            height: 120px;
            box-shadow: 3px 3px 30px rgba(0, 0, 0, 0.3);
        }

        .blursed {
            filter: blur(10px);
        }
    </style>

    <script src="vidvidvid.js" defer>

    </script>
</head>

<body class="flowy">


    <audio id="barqs"
        src="https://archive.org/download/78_dogs-large-dog-small-dog-watch-dogs-barking-angry-dogs-dogs-barking-distant_gbia0409685b/DOGS%3B%20Large%20Dog%3B%20Small%20Dog%3B%20Watch%20Dogs-%20Barking%3B%20Angry%20Dogs%3B%20Dogs%20Barking%20%28Distant%29.mp3"></audio>

    <div id="container">
        <div id="vidtitle">
            <h3>The Brollys</h3>
            <p>Duration: 43m33s</p>
            <p>United Kingdom</p>
        </div>
        <video>
        </video>
    </div>

    <nav id="progress">
        <div id="progbar"></div>
    </nav>

</body>

</html>
